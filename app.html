<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Autopan</title>
<style>
:root{--bg:#1c1c1e;--panel:#2a2a2d;--panel2:#343438;--text:#f2f2f4;--muted:#9b9ba3;--line:#45454a;--accent:#3fb865;--warn:#f2b84a;--bad:#e5534b;--blue:#3d7bd9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;font-weight:650}
header .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:20px 24px 80px}
h2{font-size:16px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#08210f;font-weight:650}
button:disabled{opacity:.45;cursor:default}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--text)}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.files{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.files div{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #2c2c30}
.files div:hover{background:var(--panel2)}
.sel{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.sel .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.stage{display:grid;grid-template-columns:22px 1fr 160px;gap:10px;align-items:center;padding:5px 0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.running{background:var(--blue)}.dot.done{background:var(--accent)}.dot.failed{background:var(--bad)}.dot.waiting{background:var(--warn)}
.pill{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--panel2)}
.pill.done{color:var(--accent)}.pill.failed{color:var(--bad)}.pill.needs_input{color:var(--warn)}.pill.running{color:var(--blue)}
.jobs .j{display:flex;gap:12px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.jobs .j:hover{background:var(--panel2)}
.jobs .j b{flex:1}
.group{display:grid;grid-template-columns:30px 1fr 150px;gap:10px;align-items:center;padding:8px;border-radius:8px;border:2px solid transparent}
.group img{width:100%;max-width:560px;border-radius:6px;display:block}
.group.A{border-color:var(--team-a,#ececec)}.group.B{border-color:var(--team-b,#3d7bd9)}
.sw{width:26px;height:44px;border-radius:5px;border:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:6px 0}
.seg button.on{background:var(--accent);color:#08210f;font-weight:650}
.warn{color:var(--warn)}.bad{color:var(--bad)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.res img{width:100%;border-radius:8px;border:1px solid var(--line)}
video{width:100%;border-radius:8px;background:#000}
a{color:var(--blue)}
.hide{display:none}
.colours{display:flex;gap:6px}.colours span{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}.colours span.on{border-color:#fff}
</style>
</head>
<body>
<header>
  <h1>⚽ Football Autopan</h1><span class="muted" id="sub"></span><span class="sp"></span>
  <select id="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
</header>
<main id="main"></main>
<script>
const TX={
en:{sub:"Pan-and-zoom video and team statistics from your 360° recording",new:"New game",games:"Your games",none:"No games yet.",
 title:"Name of the game",pick:"Choose the video files (in playing order: first half, second half)",chosen:"Chosen videos",
 add:"add",up:"up",rm:"remove",start:"Start",est:"Computing time on this computer about",hours:"h",min:"min",
 lang:"Language of the charts",halves:"Two files = two halves (the teams change sides)",up_dir:"⬆ up",home:"home",
 back:"← all games",stop:"Stop",resume:"Continue",open:"Open folder",done:"Finished",running:"Working",failed:"Problem",
 needs_input:"Waiting for you",cancelled:"Stopped",stopped:"Stopped",idle:"Ready",pending:"",remaining:"about",left:"left",
 teams_h:"Which shirts are the two teams?",teams_p:"Players seen in about 40 moments of the game, grouped by shirt colour. Mark each group: team A, team B, or other (referee, goalkeepers, odd light). Several groups can belong to one team - one team often shows as a bright and a dark group.",
 A:"Team A",B:"Team B",O:"other",nameA:"Name of team A",nameB:"Name of team B",confirm:"Confirm teams",saved:"Teams saved.",
 suggested:"A first guess is already marked - please check it.",
 q_unb:"The two teams are very different in size - one of them may be missing a colour group.",q_oth:"Many players are in 'other' - check that no team shirt is left out.",
 pre_h:"The view of the first video",pre_p:"This is what the program sees. The pitch should look natural and be inside the picture. If it looks wrong, the camera may not be set up as expected.",
 untested:"This camera layout has not been tested yet.",results:"Results",folder:"Folder",
 video:"Video",charts:"Charts",data:"Data files",err:"Error",playing:"Preview",download:"download",
 teams_wait:"The team statistics are waiting for you to confirm the teams above."},
de:{sub:"Schwenk-Video und Mannschaftsstatistik aus Ihrer 360°-Aufnahme",new:"Neues Spiel",games:"Ihre Spiele",none:"Noch keine Spiele.",
 title:"Name des Spiels",pick:"Videodateien wählen (in Spielreihenfolge: 1. Halbzeit, 2. Halbzeit)",chosen:"Gewählte Videos",
 add:"hinzufügen",up:"hoch",rm:"entfernen",start:"Start",est:"Rechenzeit auf diesem Computer ungefähr",hours:"Std",min:"Min",
 lang:"Sprache der Grafiken",halves:"Zwei Dateien = zwei Halbzeiten (Seitenwechsel)",up_dir:"⬆ hoch",home:"Home",
 back:"← alle Spiele",stop:"Stopp",resume:"Weiter",open:"Ordner öffnen",done:"Fertig",running:"In Arbeit",failed:"Problem",
 needs_input:"Wartet auf Sie",cancelled:"Gestoppt",stopped:"Gestoppt",idle:"Bereit",pending:"",remaining:"noch etwa",left:"",
 teams_h:"Welche Trikots sind die beiden Mannschaften?",teams_p:"Spieler aus etwa 40 Momenten des Spiels, nach Trikotfarbe gruppiert. Markieren Sie jede Gruppe: Team A, Team B oder andere (Schiedsrichter, Torhüter, seltsames Licht). Mehrere Gruppen können zu einem Team gehören - ein Team erscheint oft als helle und dunkle Gruppe.",
 A:"Team A",B:"Team B",O:"andere",nameA:"Name von Team A",nameB:"Name von Team B",confirm:"Teams bestätigen",saved:"Teams gespeichert.",
 suggested:"Ein erster Vorschlag ist schon markiert - bitte prüfen.",
 q_unb:"Die beiden Teams sind sehr unterschiedlich groß - vielleicht fehlt einem eine Farbgruppe.",q_oth:"Viele Spieler sind bei 'andere' - prüfen, ob kein Mannschaftstrikot fehlt.",
 pre_h:"Die Ansicht des ersten Videos",pre_p:"So sieht das Programm das Spiel. Das Feld sollte natürlich aussehen und im Bild liegen. Sieht es falsch aus, ist die Kamera evtl. nicht wie erwartet eingestellt.",
 untested:"Dieses Kameraformat wurde noch nicht getestet.",results:"Ergebnisse",folder:"Ordner",
 video:"Video",charts:"Grafiken",data:"Datendateien",err:"Fehler",playing:"Vorschau",download:"herunterladen",
 teams_wait:"Die Mannschaftsstatistik wartet darauf, dass Sie oben die Teams bestätigen."}};
const SL={check:["Look at the videos","Videos ansehen"],teams:["Find the shirt colours","Trikotfarben finden"],charts:["Where the play was","Wo gespielt wurde"],stats:["Team statistics","Mannschaftsstatistik"],package:["Collect the results","Ergebnisse sammeln"],extract:["Find the players","Spieler finden"],keyframes:["Plan the camera","Kamera planen"],render:["Make the video","Video erzeugen"]};
let lang=(navigator.language||"en").slice(0,2)==="de"?"de":"en";
try{lang=localStorage.getItem("lang")||lang}catch(e){}
const t=k=>(TX[lang]||TX.en)[k]??k;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path,body){
  const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json","X-App":"football"},body:JSON.stringify(body)};
  const r=await fetch(path,o);return r.json();
}
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h} ${t("hours")} ${m} ${t("min")}`:`${m} ${t("min")}`};
const fmtSize=b=>b>1e9?(b/1e9).toFixed(1)+" GB":(b/1e6).toFixed(0)+" MB";
const stageLabel=id=>{const m=id.match(/^(\D+)(\d*)$/);const base=SL[m[1]]?SL[m[1]][lang==="de"?1:0]:id;return base+(m[2]!==""?" ("+(+m[2]+1)+")":"")};

let view={name:"home"},picked=[],cwd="",ls=null,probeInfo=null,tick=null,form={title:"",halves:true,lang:"en"},teamEdit=null;

function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}form.lang=l;document.documentElement.lang=l;$("#sub").textContent=t("sub");render()}
$("#lang").onchange=e=>setLang(e.target.value);

async function render(){
  clearInterval(tick);
  if(view.name==="home")return home();
  return detail(view.id,true);
}

async function home(){
  const [jobs,l]=await Promise.all([api("/api/jobs"),api("/api/ls?path="+encodeURIComponent(cwd))]);
  ls=l;cwd=l.path;
  const m=$("#main");
  m.innerHTML=`<div class="card"><h2>${t("new")}</h2>
   <div class="row" style="margin-bottom:12px"><input type="text" id="ttl" placeholder="${t("title")}" value="${esc(form.title)}"></div>
   <div class="grid2"><div><div class="muted" style="margin-bottom:6px">${t("pick")}</div>
     <div class="row" style="margin-bottom:6px"><button id="upd">${t("up_dir")}</button><button id="hm">${t("home")}</button><span class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis" title="${esc(cwd)}">${esc(cwd)}</span></div>
     <div class="files" id="fl">${ls.dirs.map(d=>`<div data-d="${esc(d)}"><span>📁 ${esc(d)}</span></div>`).join("")}${ls.files.map(f=>`<div data-f="${esc(f.name)}"><span>🎞 ${esc(f.name)}</span><span class="muted">${fmtSize(f.size)}</span></div>`).join("")}</div></div>
    <div><div class="muted" style="margin-bottom:6px">${t("chosen")}</div><div class="files" id="sl">${picked.map((p,i)=>`<div class="sel" style="cursor:default"><span class="n" title="${esc(p)}">${i+1}. ${esc(p.split(/[\\/]/).pop())}</span><button data-up="${i}" ${i?"":"disabled"}>↑</button><button data-rm="${i}">✕</button></div>`).join("")}</div>
     <div id="pinfo" class="muted" style="margin-top:8px"></div>
     <div style="margin-top:10px"><label>${t("lang")}: <select id="fl2"><option value="en">English</option><option value="de">Deutsch</option></select></label></div>
     <div style="margin-top:6px"><label><input type="checkbox" id="hv" ${form.halves?"checked":""}> ${t("halves")}</label></div></div></div>
   <div class="row" style="margin-top:14px"><button class="primary" id="go" ${picked.length?"":"disabled"}>${t("start")}</button><span class="muted" id="est"></span></div></div>
   <div class="card jobs"><h2>${t("games")}</h2>${jobs.jobs.length?jobs.jobs.map(j=>`<div class="j" data-id="${esc(j.id)}"><b>${esc(j.title)}</b><span class="muted">${j.videos} video${j.videos>1?"s":""}</span><span class="pill ${j.state}">${t(j.state)}</span></div>`).join(""):`<div class="muted">${t("none")}</div>`}
   <div class="muted" style="margin-top:10px;font-size:12px">${t("folder")}: ${esc(jobs.root)}</div></div>`;
  $("#fl2").value=form.lang;$("#fl2").onchange=e=>form.lang=e.target.value;$("#hv").onchange=e=>form.halves=e.target.checked;
  $("#ttl").oninput=e=>form.title=e.target.value;
  $("#upd").onclick=()=>{cwd=ls.parent;home()};$("#hm").onclick=()=>{cwd="";home()};
  $("#fl").onclick=e=>{const el=e.target.closest("div[data-d],div[data-f]");if(!el)return;
    if(el.dataset.d){cwd=cwd+(cwd.endsWith("/")||cwd.endsWith("\\")?"":(cwd.includes("\\")?"\\":"/"))+el.dataset.d;home()}
    else{const p=cwd+(cwd.includes("\\")?"\\":"/")+el.dataset.f;if(!picked.includes(p)){picked.push(p);if(!form.title)form.title=guessTitle(p);home()}}};
  $("#sl").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.rm!==undefined)picked.splice(+b.dataset.rm,1);
    if(b.dataset.up!==undefined&&+b.dataset.up>0){const i=+b.dataset.up;[picked[i-1],picked[i]]=[picked[i],picked[i-1]]}
    home()};
  document.querySelectorAll(".jobs .j").forEach(el=>el.onclick=()=>{view={name:"job",id:el.dataset.id};render()});
  $("#go").onclick=async()=>{$("#go").disabled=true;const r=await api("/api/jobs",{title:form.title||"Game",videos:picked,lang:form.lang,halves:form.halves});
    if(r.error&&!r.id){alert(r.error);$("#go").disabled=false;return}
    if(r.error)alert(r.error);picked=[];form.title="";view={name:"job",id:r.id};render()};
  if(picked.length){const p=await api("/api/probe",{paths:picked});probeInfo=p;
    $("#pinfo").innerHTML=p.videos.map(v=>v.error?`<div class="bad">${esc(v.name)}: ${esc(v.error)}</div>`:`<div>${esc(v.name)} · ${fmtDur(v.duration)} · ${v.width}×${v.height}${v.tested?"":` <span class="warn">· ${t("untested")}</span>`}</div>`).join("");
    $("#est").textContent=`${t("est")} ${fmtDur(p.estimate_s)}`}
}
const guessTitle=p=>p.split(/[\\/]/).slice(-2,-1)[0]||"Game";

async function detail(id,full){
  const v=await api("/api/jobs/"+encodeURIComponent(id));
  const m=$("#main"),st=v.status;
  const running=st.state==="running";
  if(full||!$("#stages")){buildDetail(v)}
  paint(v);
  clearInterval(tick);
  tick=setInterval(async()=>{const w=await api("/api/jobs/"+encodeURIComponent(id));if(view.name!=="job"){clearInterval(tick);return}paint(w)},2000);
}

function buildDetail(v){
  $("#main").innerHTML=`<div class="row" style="margin-bottom:12px"><button id="bk">${t("back")}</button><h2 style="margin:0;flex:1">${esc(v.title)}</h2><span class="pill" id="pst"></span></div>
  <div class="card"><div class="row"><div style="flex:1"><div class="bar"><i id="ov" style="width:0"></i></div></div><span id="rem" class="muted"></span></div>
   <div id="stages" style="margin-top:10px"></div><div id="msg" class="bad" style="margin-top:8px"></div>
   <div class="row" style="margin-top:10px"><button id="stp">${t("stop")}</button><button id="rsm">${t("resume")}</button><button id="opn">${t("open")}</button></div></div>
  <div id="teamsbox"></div><div id="prevbox"></div><div id="resbox"></div>`;
  $("#bk").onclick=()=>{view={name:"home"};render()};
  $("#stp").onclick=()=>api(`/api/jobs/${encodeURIComponent(v.id)}/cancel`,{});
  $("#rsm").onclick=async()=>{const r=await api(`/api/jobs/${encodeURIComponent(v.id)}/resume`,{});if(r.error)alert(r.error)};
  $("#opn").onclick=()=>api(`/api/jobs/${encodeURIComponent(v.id)}/open`,{});
  teamEdit=null;builtResults="";
}
let builtResults="";
function paint(v){
  const st=v.status;
  if(!$("#stages"))return;
  const pst=$("#pst");pst.textContent=t(st.state);pst.className="pill "+st.state;
  $("#ov").style.width=(100*(st.overall||0))+"%";
  $("#rem").textContent=(st.state==="running"&&st.remaining_s!=null)?`${t("remaining")} ${fmtDur(st.remaining_s)} ${t("left")}`:"";
  $("#stages").innerHTML=(st.stages||[]).map(s=>`<div class="stage"><span class="dot ${s.state}"></span><span>${esc(stageLabel(s.id))}</span><div>${s.state==="running"?`<div class="bar"><i style="width:${100*s.progress}%"></i></div>`:`<span class="muted">${s.state==="waiting"?t("teams_wait"):""}</span>`}</div></div>`).join("");
  $("#msg").textContent=(st.state==="failed"||st.message)?(st.message||""):"";
  $("#stp").classList.toggle("hide",st.state!=="running");
  $("#rsm").classList.toggle("hide",st.state==="running"||st.state==="done");
  paintTeams(v);paintPreview(v);paintResults(v);
}
function paintPreview(v){
  const b=$("#prevbox");if(!v.has_preview||b.dataset.on)return;b.dataset.on=1;
  const warn=(v.cameras||[]).some(c=>!c.tested);
  b.innerHTML=`<div class="card"><h2>${t("pre_h")}</h2><p class="muted" style="margin-top:0">${t("pre_p")}${warn?` <span class="warn">${t("untested")}</span>`:""}</p><img src="/files/${encodeURIComponent(v.id)}/preview.jpg" style="width:100%;border-radius:8px"></div>`;
}
function paintTeams(v){
  const b=$("#teamsbox");if(!v.teams){return}
  const T=v.teams;
  if(!teamEdit){
    const has=T.assign.A.length&&T.assign.B.length;
    const src=has?T.assign:T.suggest;
    teamEdit={map:{},nameA:T.names.A,nameB:T.names.B,cA:T.colours.A,cB:T.colours.B,confirmed:has,guess:!has};
    T.groups.forEach(g=>teamEdit.map[g.index]=src.A.includes(g.index)?"A":src.B.includes(g.index)?"B":"O");
    buildTeams(v);
  }
  const q=T.quality;const w=$("#qwarn");if(w)w.innerHTML=(teamEdit.confirmed?q.warnings:[]).map(x=>x==="unbalanced"?t("q_unb"):x==="many_other"?t("q_oth"):"").map(x=>`<div class="warn">${x}</div>`).join("");
}
const PAL=["#ececec","#3d7bd9","#d9392b","#f2d04a","#3fb865","#f08a2c","#8e8e93","#9b59b6"];
function buildTeams(v){
  const T=v.teams,E=teamEdit,b=$("#teamsbox");
  b.innerHTML=`<div class="card"><h2>${t("teams_h")}</h2><p class="muted" style="margin-top:0">${t("teams_p")} ${E.guess?`<b>${t("suggested")}</b>`:""}</p>
   <div id="grps">${T.groups.map(g=>`<div class="group ${E.map[g.index]}" data-g="${g.index}"><div class="sw" style="background:rgb(${g.bgr[2]},${g.bgr[1]},${g.bgr[0]})"></div>
     <div><img src="/files/${encodeURIComponent(v.id)}/teams.groups/g${g.index}.png"><div class="muted" style="font-size:12px">${g.size} players (${g.share} %)</div></div>
     <div class="seg"><button data-v="A" class="${E.map[g.index]==="A"?"on":""}">${t("A")}</button><button data-v="B" class="${E.map[g.index]==="B"?"on":""}">${t("B")}</button><button data-v="O" class="${E.map[g.index]==="O"?"on":""}">${t("O")}</button></div></div>`).join("")}</div>
   <div class="grid2" style="margin-top:12px"><div><div class="muted">${t("nameA")}</div><input type="text" id="nA" value="${esc(E.nameA)}"><div class="colours" id="cA" style="margin-top:6px">${PAL.map(c=>`<span data-c="${c}" style="background:${c}" class="${c===E.cA?"on":""}"></span>`).join("")}</div></div>
   <div><div class="muted">${t("nameB")}</div><input type="text" id="nB" value="${esc(E.nameB)}"><div class="colours" id="cB" style="margin-top:6px">${PAL.map(c=>`<span data-c="${c}" style="background:${c}" class="${c===E.cB?"on":""}"></span>`).join("")}</div></div></div>
   <div id="qwarn" style="margin-top:8px"></div>
   <div class="row" style="margin-top:12px"><button class="primary" id="cf">${t("confirm")}</button><span id="cfm" class="muted"></span></div></div>`;
  $("#grps").onclick=e=>{const bt=e.target.closest("button");if(!bt)return;const gd=bt.closest(".group");E.map[gd.dataset.g]=bt.dataset.v;E.guess=false;E.confirmed=false;buildTeams(v)};
  $("#nA").oninput=e=>E.nameA=e.target.value;$("#nB").oninput=e=>E.nameB=e.target.value;
  for(const k of ["A","B"])$("#c"+k).onclick=e=>{const c=e.target.dataset.c;if(c){E["c"+k]=c;buildTeams(v)}};
  $("#cf").onclick=async()=>{
    const a=Object.keys(E.map).filter(k=>E.map[k]==="A").map(Number),bb=Object.keys(E.map).filter(k=>E.map[k]==="B").map(Number);
    const r=await api(`/api/jobs/${encodeURIComponent(v.id)}/teams`,{a,b:bb,name_a:E.nameA,name_b:E.nameB,colour_a:E.cA,colour_b:E.cB});
    if(r.error&&!r.ok){alert(r.error);return}
    E.confirmed=true;$("#cfm").textContent=t("saved");
    const w=await api("/api/jobs/"+encodeURIComponent(v.id));paintTeams(w)};
}
function paintResults(v){
  const key=JSON.stringify(v.files.map(f=>f.name+f.size));
  if(key===builtResults)return;builtResults=key;
  const b=$("#resbox"),id=encodeURIComponent(v.id),F=v.files;
  const vids=F.filter(f=>f.name.endsWith(".mp4")),png=F.filter(f=>f.name.endsWith(".png")),oth=F.filter(f=>!f.name.endsWith(".mp4")&&!f.name.endsWith(".png"));
  if(!F.length){b.innerHTML="";return}
  const link=f=>`<a href="/files/${id}/${encodeURIComponent(f.name)}?download=1">${esc(f.name)}</a> <span class="muted">${fmtSize(f.size)}</span>`;
  b.innerHTML=`<div class="card"><h2>${t("results")}</h2>
   ${vids.length?`<h3 class="muted" style="font-size:13px">${t("video")}</h3>${vids.map(f=>`<div style="margin-bottom:12px"><video controls preload="metadata" src="/files/${id}/${encodeURIComponent(f.name)}"></video><div>${link(f)}</div></div>`).join("")}`:""}
   ${png.length?`<h3 class="muted" style="font-size:13px">${t("charts")}</h3><div class="res">${png.map(f=>`<div><a href="/files/${id}/${encodeURIComponent(f.name)}" target="_blank"><img loading="lazy" src="/files/${id}/${encodeURIComponent(f.name)}"></a><div>${link(f)}</div></div>`).join("")}</div>`:""}
   ${oth.length?`<h3 class="muted" style="font-size:13px">${t("data")}</h3>${oth.map(f=>`<div>${link(f)}</div>`).join("")}`:""}</div>`;
}
$("#lang").value=lang;$("#sub").textContent=t("sub");document.documentElement.lang=lang;form.lang=lang;
render();
</script>
</body>
</html>
